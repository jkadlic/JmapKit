name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore JmapKit.sln

      - name: Build
        run: dotnet build JmapKit.sln --no-restore -warnaserror -c Release

      - name: Test
        run: dotnet test JmapKit.sln --no-build -c Release

      - name: Pack
        run: dotnet pack JmapKit.Core/JmapKit.Core.csproj --no-build -c Release -o ./artifacts

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USERNAME }}

      - name: Push to NuGet.org
        run: dotnet nuget push ./artifacts/*.nupkg -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
